# Release d'IdemA pour macOS Apple Silicon. Un tag v<version> construit l'app, l'emballe en DMG et l'attache à une
# release brouillon, publiée ensuite à la main. Un tag v<version>-<suffixe> (v0.3.0-rc.1) donne une pré-version.
# Lancé à la main (workflow_dispatch) depuis une branche, le DMG sort en artefact, sans release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Avant tout build : le tag porte la version de Cargo.toml et CHANGELOG.md a sa section.
      - name: Tag, version et notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Toolchain Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Outils d'icône
        run: brew install librsvg

      - name: IdemA.app
        run: scripts/bundle-app.sh

      - name: DMG
        run: scripts/make-dmg.sh

      - name: Release brouillon
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(scripts/version.sh)"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "target/IdemA-$version-arm64.dmg" \
            "target/IdemA-$version-arm64.dmg.sha256" \
            --draft $prerelease --verify-tag \
            --title "IdemA ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: DMG en artefact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: IdemA-dmg
          path: target/IdemA-*-arm64.dmg*
