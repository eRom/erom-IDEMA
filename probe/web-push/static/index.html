<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>IdemA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151516">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IdemA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  :root {
    --bg: #151516;
    --surface: #2a2a2d;
    --surface-2: #343438;
    --line: rgba(255, 255, 255, 0.10);
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.55);
    --accent: #0a84ff;
    --ok: #30d158;
    --error: #ff6961;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  section, .hint {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .hint { border-color: rgba(10, 132, 255, 0.5); }
  .hint p { margin: 0; }
  button, input {
    font: inherit;
    font-size: 17px;
    color: var(--text);
    border-radius: 12px;
    border: 1px solid var(--line);
    min-height: 48px;
    min-width: 44px;
  }
  button {
    background: var(--surface-2);
    padding: 0 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); border-color: transparent; font-weight: 600; width: 100%; }
  button:disabled { opacity: 0.5; }
  input { background: var(--bg); padding: 0 14px; width: 100%; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .reply-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  pre {
    margin: 0 0 14px;
    padding: 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: 14px/1.45 ui-monospace, "SF Mono", Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 40vh;
    overflow: auto;
  }
  .session-title { font-weight: 600; margin: 0 0 8px; }
  .status { margin: 10px 0 0; min-height: 1.45em; font-size: 15px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.error { color: var(--error); }
  details { color: var(--muted); font-size: 14px; }
  details pre { margin: 10px 0 0; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img src="/icon-180.png" alt="" width="44" height="44">
    <div>
      <h1>IdemA</h1>
      <p>Sonde de notifications</p>
    </div>
  </header>

  <div class="hint" id="install-hint" hidden>
    <p>Ajoute cette page à l'écran d'accueil (Partager, puis « Sur l'écran d'accueil »), puis ouvre-la depuis l'icône.</p>
  </div>

  <section>
    <h2>Notifications</h2>
    <button class="primary" id="enable" type="button">Activer les notifications</button>
    <p class="status" id="enable-status" role="status" aria-live="polite"></p>
  </section>

  <section id="session-panel" hidden>
    <h2>Session <span id="session-id"></span></h2>
    <p class="session-title" id="session-title"></p>
    <pre id="session-body"></pre>
    <div class="keys" id="keys"></div>
    <form class="reply-row" id="reply-form">
      <input id="reply-text" type="text" placeholder="Répondre…" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Réponse">
      <button type="submit">Envoyer</button>
    </form>
    <p class="status" id="reply-status" role="status" aria-live="polite"></p>
  </section>

  <section>
    <h2>Pastille</h2>
    <button id="clear-badge" type="button">Effacer la pastille</button>
    <p class="status" id="badge-status" role="status" aria-live="polite"></p>
  </section>

  <details>
    <summary>Diagnostic</summary>
    <pre id="diagnostic"></pre>
  </details>
</main>

<script>
'use strict';

// Touches proposées dans le panneau de session : libellé affiché, séquence envoyée (noms de touches tmux).
const KEY_BUTTONS = [
  ['1', '1'], ['2', '2'], ['3', '3'], ['y', 'y'],
  ['n', 'n'], ['Entrée', 'Enter'], ['Échap', 'Escape'], ['Ctrl-C', 'C-c'],
];

const $ = (id) => document.getElementById(id);
const sessionId = new URLSearchParams(location.search).get('session') || '';

function setStatus(id, text, kind) {
  const el = $(id);
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

// Journal de la sonde. Un échec ici ne doit pas masquer l'erreur déjà affichée à l'écran.
async function logProbe(event, detail) {
  try {
    await fetch('/api/probe-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event, detail }),
    });
  } catch (err) {
    console.warn('probe-log injoignable', err);
  }
}

function isStandalone() {
  return navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

function capabilities() {
  return {
    standalone: isStandalone(),
    hasPushManager: 'PushManager' in window,
    hasSetAppBadge: 'setAppBadge' in navigator,
    notificationPermission: 'Notification' in window ? Notification.permission : 'unsupported',
    maxActions: ('Notification' in window ? Notification.maxActions : null) ?? null,
  };
}

function urlBase64ToUint8Array(text) {
  const padded = text + '='.repeat((4 - (text.length % 4)) % 4);
  const raw = atob(padded.replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

function clockTime(isoText) {
  const date = isoText ? new Date(isoText) : new Date();
  return date.toLocaleTimeString('fr-FR', { hour12: false });
}

async function enableNotifications() {
  const button = $('enable');
  button.disabled = true;
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      setStatus('enable-status', "Les notifications push ne sont pas disponibles ici. Ouvre la page depuis l'icône de l'écran d'accueil.", 'error');
      await logProbe('enable-unsupported', capabilities());
      return;
    }
    // L'appel doit partir directement du geste de l'utilisateur.
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      setStatus('enable-status', 'Permission refusée (' + permission + '). Autorise les notifications dans les réglages de l\'iPhone.', 'error');
      await logProbe('enable-permission', { permission });
      return;
    }
    const registration = await navigator.serviceWorker.ready;
    const keyResponse = await fetch('/api/vapid-public-key');
    if (!keyResponse.ok) throw new Error('clé VAPID indisponible (HTTP ' + keyResponse.status + ')');
    const { key } = await keyResponse.json();
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(key),
    });
    const saveResponse = await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription.toJSON()),
    });
    if (!saveResponse.ok) throw new Error('le Mac a refusé l\'abonnement (HTTP ' + saveResponse.status + ')');
    setStatus('enable-status', 'Notifications activées. Abonnement enregistré sur le Mac.', 'ok');
    await logProbe('subscribed', capabilities());
  } catch (err) {
    setStatus('enable-status', 'Échec : ' + (err && err.message ? err.message : String(err)), 'error');
    await logProbe('enable-error', { name: err && err.name, message: err && err.message });
  } finally {
    button.disabled = false;
  }
}

async function sendReply(keys) {
  let response;
  try {
    response = await fetch('/api/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: sessionId, keys, source: 'page' }),
    });
  } catch (err) {
    // fetch ne rejette que sur une panne réseau : le Mac est injoignable.
    setStatus('reply-status', 'Mac injoignable : Tailscale est-il actif ?', 'error');
    console.error('reply en échec', err);
    return;
  }
  if (!response.ok) {
    setStatus('reply-status', 'Le Mac a répondu une erreur (HTTP ' + response.status + ').', 'error');
    return;
  }
  const result = await response.json();
  setStatus('reply-status', 'Reçu par le Mac à ' + clockTime(result.received_at), 'ok');
}

async function loadSession() {
  $('session-panel').hidden = false;
  $('session-id').textContent = sessionId;
  const keysBox = $('keys');
  for (const [label, keys] of KEY_BUTTONS) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.addEventListener('click', () => sendReply(keys));
    keysBox.appendChild(button);
  }
  $('reply-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const text = $('reply-text').value;
    if (!text) return;
    sendReply(text).then(() => { $('reply-text').value = ''; });
  });

  try {
    const response = await fetch('/api/session?id=' + encodeURIComponent(sessionId));
    if (response.status === 404) {
      $('session-title').textContent = 'Aucune notification enregistrée pour cette session.';
      return;
    }
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const payload = await response.json();
    $('session-title').textContent = payload.title || '';
    $('session-body').textContent = payload.body || '';
  } catch (err) {
    $('session-title').textContent = 'Mac injoignable : Tailscale est-il actif ?';
    console.error('session en échec', err);
  }
}

async function clearBadge() {
  if (!('clearAppBadge' in navigator)) {
    setStatus('badge-status', 'Pastille non prise en charge sur cet appareil.', 'error');
    return;
  }
  try {
    await navigator.clearAppBadge();
    setStatus('badge-status', 'Pastille effacée.', 'ok');
  } catch (err) {
    setStatus('badge-status', 'Échec : ' + err.message, 'error');
    await logProbe('clear-badge-error', { message: err.message });
  }
}

async function init() {
  const caps = capabilities();
  $('diagnostic').textContent = JSON.stringify(caps, null, 2);
  $('install-hint').hidden = caps.standalone;
  $('enable').addEventListener('click', enableNotifications);
  $('clear-badge').addEventListener('click', clearBadge);
  if (sessionId) loadSession();

  if ('serviceWorker' in navigator) {
    try {
      await navigator.serviceWorker.register('/sw.js');
    } catch (err) {
      setStatus('enable-status', 'Service worker non enregistré : ' + err.message, 'error');
      await logProbe('sw-register-error', { message: err.message });
    }
  }
  await logProbe('page-load', caps);
}

init();
</script>
</body>
</html>
