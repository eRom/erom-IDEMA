[package]
name = "companion-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Sonde jetable : workspace autonome, hors du workspace racine
[workspace]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
web-push-native = "0.5.0"
