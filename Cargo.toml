[workspace]
resolver = "3"
members = ["crates/idema", "crates/idema-tmux", "crates/idema-term"]

[workspace.package]
version = "0.6.1"
edition = "2024"
publish = false

[workspace.dependencies]
idema-tmux = { path = "crates/idema-tmux" }
idema-term = { path = "crates/idema-term" }
alacritty_terminal = "=0.26.0"
# gpui-pre 0.3.9 : la version de GPUI qu'épingle gpui-component 0.7.3 (spec D2).
# font-kit : sans lui, macOS ne dessine aucun glyphe. runtime_shaders : pas de Metal Toolchain à installer.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
# AppKit pour le badge du Dock et le son : les versions que gpui-pre-macos 0.3.9 tire déjà, sans les
# features par défaut (qui compileraient tout AppKit et ajouteraient trois crates au lock).
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSFileManager", "NSURL", "NSError", "NSUUID", "NSKeyValueObserving", "NSDictionary", "NSData", "NSURLRequest", "NSURLResponse", "NSValue", "NSGeometry", "NSURLSession", "NSOperation", "NSDate"] }
# renamex_np (renommage sans écrasement) pour les opérations de fichiers du volet Fichiers ; déjà au lock.
libc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSSound", "NSView", "NSWindow", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSOpenPanel", "NSSavePanel", "NSTextField", "NSEvent", "NSPasteboard", "NSWorkspace", "NSAlert", "NSGraphics", "NSGraphicsContext", "NSButton", "NSControl", "block2"] }
# Éditeur du volet Fichiers (P2) : gpui-component épingle gpui-pre 0.3.9 (spec P2 §3.1).
# Grammaires tree-sitter : les fichiers de configuration qu'on édite (json est de base), plus les langages de code
# qu'on relit (spec P2 §4.5).
gpui-component = { version = "=0.7.3", features = ["tree-sitter-markdown", "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-html", "tree-sitter-bash", "tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-swift", "tree-sitter-python", "tree-sitter-css"] }
# Grammaires que le kit livre sans coloration (Swift) ou sans balises (TSX, JSX) : IdemA les réenregistre avec leurs
# requêtes (files::grammars). Épinglées aux versions que le kit résout, comme lui-même l'est.
tree-sitter = "=0.26.13"
tree-sitter-swift = "=0.7.4"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.23.1"
# Icônes SVG de gpui-component (chemins `icons/<nom>.svg`).
gpui-kit-assets = "=0.7.3"
# Surveillance du disque ; déjà une dépendance de gpui-component, donc aucun crate de plus.
notify = "8.2"
# Recherche dans les fichiers du projet (P2 jalon 3) ; déjà au lock par gpui-base, aucun crate de plus.
regex = "1.13"
# Adresses du navigateur (P4) : analyse et encodage ; déjà au lock, aucun crate de plus.
url = "2"
# Dates RFC 3339 de la galerie Artifacts : déjà au lock (0.4.45), sans les features par défaut.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# La page web du volet Browser (P4) : objc2-web-kit entre au lock avec bitflags (déjà là).
# WKHTTPCookieStore : seulement pour relire, au démarrage, les domaines du profil dans le journal (jamais une valeur).
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationDelegate", "WKNavigationAction", "WKNavigationResponse", "WKUIDelegate", "WKFrameInfo", "WKWindowFeatures", "WKPreferences", "WKSnapshotConfiguration", "WKFindConfiguration", "WKFindResult", "WKDownload", "WKDownloadDelegate", "WKWebpagePreferences", "WKHTTPCookieStore", "WKContentWorld", "WKOpenPanelParameters", "WKUserScript", "WKUserContentController"] }
block2 = "0.6"
raw-window-handle = "0.6"
# Service HTTP du compagnon iPhone. tokio 1.53.3 est déjà au lock (tiré par gpui-pre-reqwest, via gpui-kit-assets) :
# même version, `=` comme les autres, et seulement le runtime, les prises, les délais et les canaux.
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net", "time", "sync"] }
# axum 0.8.9 sans ses features par défaut (ni JSON, ni formulaire, ni tracing) : `query` lit les paramètres d'URL, et
# les corps sont lus à la main pour répondre 400 à tout ce qui n'est pas exactement la forme attendue.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
# Appairage du compagnon : empreinte SHA-256 des jetons d'appareil (le jeton n'est jamais gardé).
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
# Hasard cryptographique des codes d'appairage et des jetons : `OsRng` et `RngCore` seulement (rand 0.8, celui que
# p256 0.13 exigera pour le push ; jamais le rand 0.9 déjà compilé).
rand = { version = "=0.8.8", default-features = false, features = ["getrandom", "std"] }
# Jeton d'appareil en base64url sans remplissage (cookie) ; déjà compilé pour macOS.
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
# Écran d'un pane en gzip pour le téléphone (`Accept-Encoding`) ; déjà compilé pour macOS, backend Rust seulement.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Notifications Web Push du compagnon (RFC 8291 et 8292), écrites sur les crates RustCrypto : `ecdh` pour la clé
# partagée avec le téléphone, `ecdsa` pour le jeton VAPID (ES256) ; sans les features par défaut (ni PEM, ni PKCS8).
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa"] }
# Chiffrement du contenu en AES-128-GCM (aes128gcm) ; `aes` et `alloc` suffisent, sans le trait de sérialisation.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
# Dérivation de la clé et du nonce du message à partir du secret partagé (RFC 8291 §3.3-3.4).
hkdf = { version = "=0.12.4", default-features = false }
# QR code de l'adresse tailnet dans Personnaliser : encodeur seul, sans dépendance, qui rend la matrice de modules.
qrcodegen = { version = "=1.8.0", default-features = false }

# gpui-base 0.7.3 recopié tel que publié, plus un seul patch : en police monospace, le retour à la ligne mesure les
# lignes simples par sommes de largeurs de caractère (celles qui empruntent une police de secours seulement si leur
# largeur totale concorde), au lieu de façonner chaque préfixe sondé avec CoreText (près de 30 fois plus rapide ;
# `text_wrapper.rs`, blocs marqués « IdemA »). Sans lui, un fichier de 1 Mo
# gèle l'interface 3 s à l'ouverture et près de 2 s à chaque changement de largeur. Le patch se relit par
# `diff -ru ~/.cargo/registry/src/index.crates.io-*/gpui-base-0.7.3 vendor/gpui-base`.
# Montée de version : 0.8.0 a le même `text_wrapper.rs`, 0.8.1 le modifie (taquets de tabulation) et 0.9.0 le réécrit
# (cache des coupures au redimensionnement, PR longbridge/gpui-kit#3691, mais toujours un façonnage par préfixe à
# l'ouverture) en épinglant gpui-pre 0.3.11. Le patch ne se réapplique donc pas tel quel : le reporter à la main, puis
# rejouer le banc local de l'éditeur (`tests/perf/editor-bench/run.sh <racine>`, hors dépôt public comme les tests
# d'acceptance), dont la sonde recopie le patch et doit être mise à jour avec lui.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
